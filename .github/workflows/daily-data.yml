name: Actualizar datos cada dia

# Cada dia al empezar el dia en Peru (00:10, UTC-5) se regenera la copia de datos del frontend
# con lo que devuelve la API. Si cambia algo se sube a main y Vercel vuelve a desplegar solo.
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerar la copia de datos desde la API
        working-directory: frontend
        run: node scripts/snapshot-api.mjs
      - name: Subir si hubo cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git config user.name "yakana-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/lib/api-snapshot.ts
          git commit -m "chore(data): actualizacion diaria de la copia de datos desde la API"
          git push origin main
