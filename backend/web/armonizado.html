<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serie armonizada · Calendario del Fuego</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f6f1e8; --ink:#211a1f; --muted:#6d625c; --card:#fffdf8; --line:#e4d9cc; --alta:#9a3412; --ok:#1f7a4d; --bajo:#1d4e89; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header, main { width:min(1180px, calc(100% - 32px)); margin:0 auto; }
  header { padding:28px 0 8px; }
  h1 { font-size:28px; margin:0 0 6px; }
  p { margin:0; color:var(--muted); }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; margin:18px 0; }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:700; color:var(--muted); }
  input, select { font:inherit; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  button, a.btn { background:#9f1239; color:#fff; border:0; border-radius:999px; padding:10px 16px; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; }
  .grid { display:grid; grid-template-columns: 1.3fr 0.7fr; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .cal { display:flex; flex-direction:column; min-height:560px; }
  #grafico { flex:1; min-height:320px; margin-top:12px; }
  #grafico svg { width:100%; height:100%; display:block; }
  #cal { width:100%; border-collapse:collapse; font-size:12px; }
  #cal th, #cal td { padding:3px; text-align:center; }
  #cal td { border-radius:4px; min-width:28px; cursor:pointer; }
  .alto { background:#fdba74; } .normal { background:#f5e6c8; } .bajo { background:#bfdbfe; }
  .est { outline:1px dashed #9a3412; outline-offset:-1px; }
  #map { height:520px; border-radius:12px; }
  .leyenda { display:flex; gap:12px; font-size:12px; color:var(--muted); margin-top:8px; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
  .inusual { background:#f87171; }
  #alerta { margin-bottom:16px; }
  #alerta h2 { font-size:16px; margin:0 0 4px; }
  #alerta ul { list-style:none; margin:10px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
  #alerta li { border-radius:10px; padding:6px 10px; font-size:13px; cursor:pointer; }
  button.sec, a.btn.sec { background:#fff; color:var(--ink); border:1px solid var(--line); }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Serie armonizada</h1>
  <p id="lead">Un solo VIIRS por día. Antes del 20 de enero de 2012, MODIS convertido a hotspots equivalentes.</p>
</header>
<main>
  <div class="row">
    <label>Región
      <select id="region"></select>
    </label>
    <label>Desde
      <input id="desde" type="date" value="2026-08-01">
    </label>
    <label>Hasta
      <input id="hasta" type="date" value="2026-09-30">
    </label>
    <button id="go" type="button">Ver</button>
    <button id="csv" type="button">CSV</button>
    <button id="area" type="button" class="sec" title="Calendario y mapa solo del recuadro que se ve en el mapa">Usar el área del mapa</button>
    <span style="margin-left:auto; display:flex; gap:8px">
      <a class="btn sec" href="prevencion.html" data-pagina="prevencion.html">Prevención</a>
      <a class="btn sec" href="radar.html" data-pagina="radar.html">Radar de la semana</a>
    </span>
  </div>
  <p id="resumen"></p>
  <div id="alerta" class="card" hidden></div>
  <div class="grid">
    <div class="card cal">
      <table id="cal"></table>
      <div class="leyenda">
        <span><i class="sw bajo"></i>bajo</span>
        <span><i class="sw normal"></i>normal</span>
        <span><i class="sw alto"></i>alto</span>
        <span><i class="sw inusual"></i>inusual (solo en los últimos días)</span>
        <span>El borde punteado es un mes estimado desde MODIS.</span>
      </div>
      <div id="grafico"></div>
    </div>
    <div class="card">
      <div id="map"></div>
      <p id="mapnote" style="margin-top:8px"></p>
    </div>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="comun.js"></script>
<script>
const $ = id => document.getElementById(id);
const map = L.map("map").setView([-9.2, -75], 5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(map);
let capa = L.layerGroup().addTo(map);
let meses = [];

function intensidad(hs, max) {
  if (!max || hs <= 0) return 0;
  return Math.min(1, Math.log1p(hs) / Math.log1p(max));
}

function color(t) {
  const stops = [[254, 249, 195], [245, 158, 11], [194, 65, 12], [127, 29, 29]];
  const x = Math.min(1, Math.max(0, t)) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(x));
  const f = x - i;
  const c = stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

async function cargarRegiones() {
  const lista = await (await fetch(API + "/regions")).json();
  $("region").innerHTML = lista.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
  $("region").value = "PE-UCA";
  const val = await (await fetch(API + "/validation")).json();
  if (val && val.nota) {
    $("lead").textContent = val.nota;
  } else {
    const c = val.con_temporada || {};
    const pct = (x) => x == null ? "—" : (100 * x).toFixed(1) + "%";
    $("lead").textContent = `Error nacional en 2020–2022: ${pct(c.error_nacional)}. Por departamento y mes: ${pct(c.error_departamento_mes)}. Meses dentro de p10–p90: ${pct(c.dentro_p10_p90)}.`;
  }
}

function pintarCalendario() {
  const porAno = {};
  meses.forEach(m => { (porAno[m.year] ||= [])[m.month] = m; });
  const anos = Object.keys(porAno).sort();
  let html = "<tr><th></th>" + "E F M A M J J A S O N D".split(" ").map(m => `<th>${m}</th>`).join("") + "<th>total por año</th></tr>";
  anos.forEach(ano => {
    html += `<tr><th>${ano}</th>`;
    let suma = 0;
    for (let mes = 1; mes <= 12; mes++) {
      const m = porAno[ano][mes];
      if (!m) { html += "<td></td>"; continue; }
      suma += m.hs;
      const est = m.source === "MODIS_ADJ" || m.source === "mixto" ? " est" : "";
      html += `<td class="${m.estado}${est}" data-y="${ano}" data-m="${mes}" title="${ano}-${String(mes).padStart(2,"0")}: ${m.hs} (${m.estado})">${Math.round(m.hs)}</td>`;
    }
    html += `<td>${Math.round(suma)}</td></tr>`;
  });
  $("cal").innerHTML = html;
  pintarGrafico();
}

const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

function pintarGrafico() {
  const box = $("grafico");
  if (!meses.length) { box.innerHTML = ""; return; }
  const serie = [...meses].sort((a, b) => a.year - b.year || a.month - b.month);
  const max = Math.max(...serie.map(m => m.hs), 1);
  const nombre = caja ? "Área del mapa" : ($("region").selectedOptions[0] ? $("region").selectedOptions[0].textContent.trim() : "");
  const W = 640, H = 320, izq = 52, der = 12, arriba = 28, abajo = 32;
  const ancho = W - izq - der;
  const alto = H - arriba - abajo;
  const hueco = ancho / serie.length;
  let barras = "";
  serie.forEach((m, i) => {
    const h = Math.max(2, (m.hs / max) * alto);
    const x = izq + i * hueco + hueco * 0.18;
    const y = arriba + alto - h;
    const w = hueco * 0.64;
    const t = intensidad(m.hs, max);
    barras += `<rect class="barra" data-y="${m.year}" data-m="${m.month}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color(t)}"><title>${MESES[m.month - 1]} ${m.year}: ${Math.round(m.hs)}</title></rect>`;
    // with many months each bar label overlaps: label the year, every other January
    const rotulo = serie.length <= 24 ? MESES[m.month - 1] : (m.month === 1 && m.year % 2 === 1 ? m.year : "");
    if (rotulo) barras += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#6d625c">${rotulo}</text>`;
  });
  const marcas = [0, 0.5, 1].map(p => {
    const valor = Math.round(max * p);
    const y = arriba + alto - p * alto;
    return `<text x="${izq - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6d625c">${valor}</text><line x1="${izq}" y1="${y}" x2="${W - der}" y2="${y}" stroke="#e4d9cc"/>`;
  }).join("");
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hotspots por mes">
    <text x="${izq}" y="16" font-size="13" font-weight="700" fill="#211a1f">Hotspots por mes · ${nombre}</text>
    ${marcas}${barras}
  </svg>`;
}

function campoCsv(valor) {
  const texto = String(valor ?? "");
  return /[",\n]/.test(texto) ? `"${texto.replaceAll('"', '""')}"` : texto;
}

function descargarCsv() {
  if (!meses.length) return;
  const region = $("region").value;
  const nombre = $("region").selectedOptions[0].textContent.trim();
  const lineas = [["region_id", "region", "anio", "mes", "hotspots", "hotspots_min", "hotspots_max", "frp_mw", "fuente"].join(",")];
  meses.forEach(m => {
    lineas.push([region, campoCsv(nombre), m.year, m.month, m.hs, m.hs_lo, m.hs_hi, m.frp, m.source].join(","));
  });
  const blob = new Blob(["\uFEFF" + lineas.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
  const enlace = document.createElement("a");
  enlace.href = URL.createObjectURL(blob);
  enlace.download = `${region}.csv`;
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  URL.revokeObjectURL(enlace.href);
}

let caja = null;   // [west, south, east, north] when the map area is used

async function alerta() {
  const a = await (await fetch(API + "/alert?dias=7")).json();
  if (!a.departamentos) return;
  const marcados = a.departamentos.filter(d => d.estado === "inusual" || d.estado === "alto");
  const item = d => `<li class="${d.estado}" data-id="${d.region_id}" title="Mediana de esos días: ${d.median}. Percentil 90: ${d.p90}">${d.name}: ${Math.round(d.hs)} · ${d.estado}</li>`;
  $("alerta").innerHTML = `<h2>Últimos ${a.dias} días (${a.desde} a ${a.hasta}) frente a lo normal</h2>
    <p>Perú: ${Math.round(a.peru.hs)} hotspots, ${a.peru.estado} (mediana ${Math.round(a.peru.median)}). Se compara con ${a.base}.</p>
    <ul>${marcados.length ? marcados.map(item).join("") : "<li class='normal'>Ningún departamento por encima de lo habitual</li>"}</ul>
    <p style="margin-top:8px;font-size:12px">${a.nota}</p>`;
  $("alerta").hidden = false;
}

async function ver(desde, hasta) {
  const region = $("region").value;
  const q = caja ? `west=${caja[0]}&south=${caja[1]}&east=${caja[2]}&north=${caja[3]}` : "";
  const cal = await (await fetch(caja ? `${API}/calendar/area?${q}` : `${API}/calendar?region_id=${region}`)).json();
  meses = cal.months || [];
  pintarCalendario();
  const enRango = meses.filter(m => {
    const ini = `${m.year}-${String(m.month).padStart(2,"0")}-01`;
    const fin = `${m.year}-${String(m.month).padStart(2,"0")}-28`;
    return fin >= desde && ini <= hasta;
  });
  const total = enRango.reduce((s, m) => s + m.hs, 0);
  const pico = [...meses].sort((a, b) => b.hs - a.hs)[0];
  $("resumen").textContent = `${cal.name}: ${Math.round(total)} hotspots equivalentes entre ${desde} y ${hasta}.` +
    (pico ? ` Mes más alto de la serie: ${pico.year}-${String(pico.month).padStart(2,"0")} (${Math.round(pico.hs)}).` : "");
  const heat = await (await fetch(`${API}/heatmap?start=${desde}&end=${hasta}&region_id=${region}${caja ? "&" + q : ""}`)).json();
  capa.clearLayers();
  const feats = heat.features || [];
  const max = feats.reduce((m, f) => Math.max(m, f.properties.hs), 0);
  const pts = [];
  feats.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const t = intensidad(f.properties.hs, max);
    L.circleMarker([lat, lon], {
      radius: 2 + t * 3.5,
      color: color(t),
      weight: 0,
      fillColor: color(t),
      fillOpacity: 0.8,
    }).bindTooltip(`${Math.round(f.properties.hs)} hotspots`).addTo(capa);
    pts.push([lat, lon]);
  });
  map.invalidateSize();
  if (pts.length && !caja) map.fitBounds(pts, { padding: [24, 24], maxZoom: 9 });
  $("mapnote").textContent = feats.length
    ? `${feats.length} puntos de ${heat.celdas} celdas en ${cal.name}. Amarillo: pocos. Rojo oscuro: el máximo del mapa (${Math.round(max)}).`
    : "No hay puntos en ese intervalo.";
}

$("go").onclick = () => { caja = null; ver($("desde").value, $("hasta").value); };
$("region").onchange = () => { caja = null; };
$("area").onclick = () => {
  const b = map.getBounds();
  caja = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(v => Number(v.toFixed(4)));
  ver($("desde").value, $("hasta").value);
};
$("alerta").onclick = (ev) => {
  const li = ev.target.closest("li[data-id]");
  if (!li) return;
  caja = null;
  $("region").value = li.dataset.id;
  ver($("desde").value, $("hasta").value);
};
$("csv").onclick = () => descargarCsv();
$("grafico").onclick = (ev) => {
  const barra = ev.target.closest(".barra");
  if (!barra) return;
  const y = barra.dataset.y, m = String(barra.dataset.m).padStart(2, "0");
  const ultimo = new Date(Number(y), Number(m), 0).getDate();
  $("desde").value = `${y}-${m}-01`;
  $("hasta").value = `${y}-${m}-${String(ultimo).padStart(2, "0")}`;
  ver($("desde").value, $("hasta").value);
};
$("cal").onclick = (ev) => {
  const td = ev.target.closest("td[data-y]");
  if (!td) return;
  const y = td.dataset.y, m = String(td.dataset.m).padStart(2, "0");
  const ultimo = new Date(Number(y), Number(m), 0).getDate();
  $("desde").value = `${y}-${m}-01`;
  $("hasta").value = `${y}-${m}-${String(ultimo).padStart(2, "0")}`;
  ver($("desde").value, $("hasta").value);
};
cargarRegiones().then(() => ver("2026-08-01", "2026-09-30")).then(alerta).catch(err => {
  $("resumen").textContent = mensajeApi(err);
});
</script>
</body>
</html>
