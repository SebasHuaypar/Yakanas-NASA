# Usage:
#   docker compose up -d --build          API on :8000 and pages on :5500
#   docker compose run --rm serie         builds the 2003–today series (needs .env with FIRMS_MAP_KEY)
#   docker compose run --rm semana        downloads the recent week for /week, /heat, and /fires
x-backend: &backend
  build: .
  volumes:
    - ./data:/app/data

services:
  api:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    working_dir: /app/web
    volumes:
      - ./web:/app/web   # page edits show up without a rebuild
    command: ["python", "-m", "http.server", "5500", "--bind", "0.0.0.0"]
    ports: ["5500:5500"]
    depends_on:
      api: { condition: service_healthy }

  serie:
    <<: *backend
    profiles: ["datos"]
    env_file: [{ path: .env, required: false }]
    command: ["python", "run_serie.py"]

  semana:
    <<: *backend
    profiles: ["datos"]
    env_file: [{ path: .env, required: false }]
    command: ["python", "run_week.py"]
